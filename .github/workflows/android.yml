name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Restore Gradle configuration cache
        uses: actions/cache@v6
        with:
          path: .gradle/configuration-cache
          key: gradle-config-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}-${{ github.run_id }}
          restore-keys: |
            gradle-config-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}-

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Download pinned Kino Core AAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kino-core"
          gh release download v0.1.5 \
            --repo TeamShryne/kino-core \
            --pattern 'kino-core.aar*' \
            --dir "$RUNNER_TEMP/kino-core"
          cd "$RUNNER_TEMP/kino-core"
          sha256sum --check kino-core.aar.sha256

      - name: Configure persistent debug signing
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.KINO_ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.KINO_ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: kino-debug
        shell: bash
        run: |
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" || -z "$ANDROID_DEBUG_KEYSTORE_PASSWORD" ]]; then
            echo "Persistent debug signing secrets are unavailable; using the runner's default debug key."
            exit 0
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kino-debug.keystore"
          {
            echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/kino-debug.keystore"
            echo "ANDROID_DEBUG_KEYSTORE_PASSWORD=$ANDROID_DEBUG_KEYSTORE_PASSWORD"
            echo "ANDROID_DEBUG_KEY_ALIAS=$ANDROID_DEBUG_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --build-cache --configuration-cache --parallel :app:assembleDebug -PkinoCoreAar="$RUNNER_TEMP/kino-core/kino-core.aar"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kino-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  prune-caches:
    name: Prune old Actions caches
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep the 15 newest repository caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t stale_ids < <(
            gh api --paginate "repos/${REPOSITORY}/actions/caches?per_page=100" \
              --jq '.actions_caches[] | [.id, .created_at] | @tsv' \
              | sort -k2,2r \
              | awk 'NR > 15 { print $1 }'
          )
          for cache_id in "${stale_ids[@]}"; do
            gh api --silent --method DELETE "repos/${REPOSITORY}/actions/caches/${cache_id}"
          done
